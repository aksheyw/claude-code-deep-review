<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Your pull request, test plan or design document goes through one pass of fourteen lenses: file coverage, the contract between app and server, security, state, config and nine more. If that pass finds anything new, all fourteen run again. When a pass finds nothing new, you ship.">
  <rect x="0" y="0" width="900" height="268" rx="14" fill="#FFFFFF"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- A: input -->
    <rect x="20" y="44" width="164" height="100" rx="10" fill="#F3F5F9" stroke="#1B2A4A" stroke-width="2"/>
    <text x="102" y="80" text-anchor="middle" font-size="16" fill="#1B2A4A">Your pull request,</text>
    <text x="102" y="102" text-anchor="middle" font-size="16" fill="#1B2A4A">test plan or</text>
    <text x="102" y="124" text-anchor="middle" font-size="16" fill="#1B2A4A">design document</text>

    <line x1="186" y1="94" x2="208" y2="94" stroke="#1B2A4A" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- B: the pass -->
    <rect x="214" y="44" width="300" height="100" rx="10" fill="#E6F4F1" stroke="#0E9384" stroke-width="2.5"/>
    <text x="364" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#0B6E5F">One pass = 14 lenses</text>
    <text x="364" y="102" text-anchor="middle" font-size="13.5" fill="#0B6E5F">file coverage · app-server contract</text>
    <text x="364" y="124" text-anchor="middle" font-size="13.5" fill="#0B6E5F">security · state · config · and 9 more</text>

    <line x1="516" y1="94" x2="542" y2="94" stroke="#1B2A4A" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- C: the gate -->
    <rect x="548" y="44" width="170" height="100" rx="10" fill="#F3F5F9" stroke="#1B2A4A" stroke-width="2"/>
    <text x="633" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2A4A">Found anything</text>
    <text x="633" y="111" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2A4A">new?</text>

    <line x1="720" y1="94" x2="746" y2="94" stroke="#1B2A4A" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="733" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4A">no</text>

    <!-- D: done -->
    <rect x="752" y="44" width="124" height="100" rx="10" fill="#1B2A4A"/>
    <text x="814" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Now you</text>
    <text x="814" y="111" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">can ship</text>

    <!-- loop back -->
    <path d="M 633 146 L 633 206 L 364 206 L 364 150" fill="none" stroke="#B42318" stroke-width="2.5"
          stroke-dasharray="7 5" marker-end="url(#ah)"/>
    <text x="498" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">yes, so run all 14 again</text>
  </g>
</svg>
